<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hooked — Say Hi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Space+Mono:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
  <a class="logo" href="index.html">🧶 Hooked</a>
  <div class="navlinks">
    <a href="tutorials.html">Watch &amp; Learn</a>
    <a href="squad.html">Squad Corner</a>
    <a href="giving-back.html">Giving Back</a>
    <a href="contact.html" class="active">Say Hi</a>
  </div>
</nav>
<div class="chain"></div>

<header class="page-hero">
  <span class="eyebrow">let's talk yarn</span>
  <h1 class="headline">say hi</h1>
  <p class="sub">Got yarn to donate, a pattern request, or just want to say hi? This is the spot.</p>
</header>

<div class="chain thin"></div>

<div class="contact-grid" style="margin-top:36px;">
  <div class="form-card">
    <label for="name">First name</label>
    <input id="name" type="text" placeholder="Your first name">
    <label for="reason">What's this about?</label>
    <select id="reason">
      <option>Yarn donation</option>
      <option>Pattern request</option>
      <option>Volunteering / facility visit</option>
      <option>Just saying hi</option>
    </select>
    <label for="msg">Message</label>
    <textarea id="msg" placeholder="Tell me a bit more..."></textarea>
    <div style="margin-top:20px;">
      <button class="btn btn-primary" type="button">Send message</button>
    </div>
  </div>

  <div class="follow-card">
    <h3>find us elsewhere</h3>
    <div class="follow-links">
      <a href="#">Instagram <span>→</span></a>
      <a href="#">YouTube <span>→</span></a>
      <a href="#">TikTok <span>→</span></a>
      <a href="#">Email <span>→</span></a>
    </div>
  </div>
</div>

<div class="chain"></div>

<footer>
  <div class="logo">🧶 Hooked</div>
  <p>Made with a hook, some yarn, and way too many stitch markers.</p>
</footer>

</body>
</html>
